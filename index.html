<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'app occupe TOUT l'écran, y compris autour de
         l'encoche iPhone (les zones sont protégées via env(safe-area-inset-*)) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preload" as="image" href="/vegeta.webp" />
    <meta name="description" content="DZ STREAM — ton univers de streaming. Films, séries, addons et lecture P2P." />
    <!-- PWA : application installable (écran d'accueil, plein écran) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DZ STREAM" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Polices : préconnexion puis <link> non bloquant (media=print→all) —
         l'@import CSS bloquait le premier rendu sur mobile. -->
    <link rel="preconnect" href="https://images.metahub.space" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@300,400,500,700&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@300,400,500,700&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" />
    </noscript>
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
        <link rel="preconnect" href="https://v3-cinemeta.strem.io" crossorigin>
    <link rel="preconnect" href="https://api.alldebrid.com" crossorigin>
    <link rel="dns-prefetch" href="https://torrentio.strem.fun">
    <link rel="dns-prefetch" href="https://api.opensubtitles.com">
    <title>DZ STREAM — Films, Séries & Streaming P2P</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
