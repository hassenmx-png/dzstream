name: Build Android APK

on:
  workflow_dispatch:   # déclenchement manuel (bouton "Run workflow")
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (webDir requis par cap sync)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dz-stream-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: DZ Stream Android (dernier build)
          body: APK Android — build automatique. Installez-le sur votre TV/box Android (sources inconnues).
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true

